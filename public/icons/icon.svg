<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Statue of Liberty Odaiba">
  <title>Statue of Liberty Odaiba</title>
  <rect width="512" height="512" rx="108" fill="#3a7a8d"/>
  <g fill="#f5f0e8">
    <!-- 皇冠光芒 -->
    <g transform="translate(256 148)">
      <rect x="-6" y="-98" width="12" height="48" rx="6"/>
      <rect x="-6" y="-98" width="12" height="48" rx="6" transform="rotate(-30)"/>
      <rect x="-6" y="-98" width="12" height="48" rx="6" transform="rotate(-60)"/>
      <rect x="-6" y="-98" width="12" height="48" rx="6" transform="rotate(30)"/>
      <rect x="-6" y="-98" width="12" height="48" rx="6" transform="rotate(60)"/>
    </g>
    <!-- 头部 -->
    <circle cx="256" cy="148" r="44"/>
    <!-- 高举火炬的手臂 -->
    <path d="M300 236l46-72 14 10-46 72z"/>
    <!-- 身体 -->
